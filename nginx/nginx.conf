events {
    worker_connections 1024;
}

http {
    # Upstream definitions for the two application services. The hostnames
    # (backend, ui) resolve via Docker Compose's internal DNS.
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server ui:8501;
    }

    # Map the Upgrade header so WebSocket connections (used by Streamlit's
    # /_stcore/stream channel) are proxied correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Honour X-Forwarded-Proto from an outer load balancer if present.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Allow large document uploads (backend MAX_UPLOAD_SIZE is 50MB).
        client_max_body_size 60m;

        # ---- Backend (FastAPI) ----
        # API, health check and the auto-generated API docs route to the
        # FastAPI service.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # ---- Frontend (Streamlit) ----
        # Everything else (root, static assets, and the _stcore WebSocket
        # channel) routes to the Streamlit UI.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
